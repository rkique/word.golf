<script>
    function beginTutorial() {
        //clear help finish modal if necessary.
        document.getElementById('modal-finish-guest').style.display = 'none';
        document.getElementById('modal-finish-user').style.display = 'none';
        localStorage.setItem('is_help', 'true');
        data = sendAndReceiveXML(`help=true`);
        let promptsTitle = document.getElementById('prompts-title');
        if (promptsTitle) {
            promptsTitle.innerText = 'Tutorial';
        }
        renderLinks(data.prompt, data.results)
        clearBoxes()
        renderPrompts(data.jumpsArray, data.startTargetIdxs, data.prompt)
        activateLinks()
        addHelpFocuses(data.prompt, data.results)
    }

    function renderLogin(email) {
        localStorage.setItem('logged_in', email);
        localStorage.setItem('is_help', false);
        document.getElementById('logged_in-username').textContent = email;
        // const loginWelcome = document.getElementById('login-welcome');
        // loginWelcome.style.display = 'flex';
        // loginWelcome.querySelector('.welcome-email').textContent = text.email;
        document.getElementById('guest-buttons').style.display = 'none';
        document.getElementById('logged_in-buttons').style.display = 'flex';
    }

    async function renderLogout(){
        try {
            const res = await fetch("/logout", {
                method: "POST",
                credentials: "include", // to store cookies sent by backend (make sure all requests to backend have this)
                headers: {
                    'Content-Type': 'application/json'  // Ensure this matches what the server expects
                },
                body: JSON.stringify({
                    date: new Date().toISOString().split('T')[0]
                })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.removeItem('logged_in');
                const loginWelcome = document.getElementById('login-welcome');
                const logged_in_buttons = document.getElementById('logged_in-buttons');
                loginWelcome.style.display = 'none';
                logged_in_buttons.style.display = 'none';
                const logoutButton = document.getElementById('guest-buttons');
                logoutButton.style.display = 'flex';
                window.location.href = '/';
            } else {
                console.log("Logout failed:", data);
            }
        } catch (err) {
            console.log("Error during logout:", err);
        }
        // }
    }

</script>
