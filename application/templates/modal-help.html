<script>
    function beginTutorial() {
        //clear help finish modal if necessary.
        document.getElementById('modal-finish-guest').style.display = 'none';
        document.getElementById('modal-finish-user').style.display = 'none';
        localStorage.setItem('is_help', 'true');
        data = sendAndReceiveXML(`help=true`);
        document.getElementById('prompts-title-heading').innerText = 'Tutorial';
        document.getElementById('prompts-count-remainder').innerText = '/2'

        renderLinks(data.prompt, data.results)
        clearBoxes()
        renderPrompts(data.jumpsArray, data.startTargetIdxs, data.prompt)
        activateLinks()
        addHelpFocuses(data.prompt, data.results)
    }

    function renderLogin(email) {
        localStorage.setItem('logged_in', email);
        localStorage.setItem('is_help', false);
        document.getElementById('logged_in-username').textContent = email;
        // const loginWelcome = document.getElementById('login-welcome');
        // loginWelcome.style.display = 'flex';
        // loginWelcome.querySelector('.welcome-email').textContent = text.email;
        document.getElementById('guest-buttons').style.display = 'none';
        document.getElementById('logged_in-buttons').style.display = 'flex';
    }
</script>
<div id="help" class="help">

            <h1>How to play</h1>

            <p>Link two words by clicking their neighbors.</p>

            <p>Choose carefully! You only need two jumps.</p>
            <p class='--grayed-out'>whisper ⟶ shouting ⟶ scuffle</p>
            <p>Five prompts daily. The best score is ten.</p>
        </div>
        <div class="logged_in-buttons" id="logged_in-buttons">
            <p>Logged in as <span id="logged_in-username"></span></p>
        </div>
        <div class="guest-buttons" id="guest-buttons">
        <button onclick="closeModal('help'); beginTutorial()" class=" switch switch--outlined ">tutorial</button>
