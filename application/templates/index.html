<!DOCTYPE html>

<head>
    {% include 'head.html' %}
    <title>word.golf</title>
</head>

{% if backend_url != "https://routes.word.golf" %}
  <p style="position: absolute; top: 0; left: 0">Dev: {{ backend_url }}</p>
{% endif %}
{% include 'settings.html' %}
{% include 'modal-help.html' %}
{% include 'modal.html' %}
{% include 'modal-finish-user.html' %}
{% include 'modal-finish-guest.html' %}

<div id="global">
    <div id="info-box"></div>
    <div id="wordspace-container">
        <div id="wordspace"></div>
    </div>
    <div id="prompts-container">
        <div id="prompts">
            <div class="prompt-box"> </div>
            <div class="prompt-box"> </div>
            <div class="prompt-box"> </div>
            <div class="prompt-box"> </div>
            <div class="prompt-box"> </div>
        </div>
    </div>

</div>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Z90RQN4KLB"></script>
<script src="static/js/gtag.js"></script>
<script src="static/js/XML.js"></script>
<script src="static/js/links__util.js"></script>
<script src="static/js/key_commands.js"></script>
<script src="static/js/animation.js"></script>
<script src="static/js/links.js"></script>
<script src="static/js/information.js"></script>
<script src="static/js/prompts.js"></script>

<script>data = JSON.parse('{{data|tojson|safe}}');
</script>
<script src="static/js/is_game_complete.js"> </script>
<script>

    function loadLocalStorage() {
        let prompt_idx = parseInt(localStorage.getItem('prompt_idx')) || 0;
        let jumpsA = localStorage.getItem('jumpsA') !== '' ? JSON.parse(localStorage.getItem('jumpsA')) : [];
        let jumps = parseInt(localStorage.getItem('jumps')) || 0;
        let results = JSON.parse(localStorage.getItem('results')) || [];
        let prompts = JSON.parse(localStorage.getItem('prompts')) || [];
        let start_target = prompts.slice(prompt_idx, prompt_idx + 2);
        console.log(`Loading from local storage: prompt_idx: ${prompt_idx}, jumpsA: ${jumpsA}, jumps: ${jumps}, results: ${results}, start_target: ${start_target}, prompts: ${prompts}`);
        return { jumpsA, jumps, results, prompt_idx, start_target, prompts };
    }

    //if the user has never completed the help sequence before, 
    //use a help_session.
    is_help = localStorage.getItem('is_help');
    if (is_help !== 'false') {
        startHelpSession()
    }

    localStorage.setItem('current_date', data['date']);
    localStorage.setItem('daily_idx', data['daily_idx']);

    fetch(`${window.backendURL}/is_logged_in`, {
        method: 'POST',
        credentials: 'include',
        headers: {
            'Content-Type': 'application/json'
        }
    })
        .then(response => response.json())
        .then(login_data => {
            if (login_data.logged_in) {
                localStorage.setItem('logged_in', login_data.email);
                renderLogin(login_data)
            }
            let loaded;
            let prompt_idx;
            if (localStorage.getItem('results')) {
                console.log('Loading from local storage');
                loaded = loadLocalStorage();
                prompt_idx = loaded.prompt_idx;
            } else {
                console.log('Loading from data');
                loaded = data;
                prompt_idx = data['i'];
            }
            let jumpsA = loaded.jumpsA;
            let jumps = loaded.jumps;
            let results = loaded.results || data['results'];
            let prompts = loaded.prompts;
            let start_target = prompts[prompt_idx]
            console.log(`[final] jumpsA: ${jumpsA}, jumps: ${jumps}, results: ${results}, prompt_idx: ${prompt_idx}, start_target: ${start_target}, prompts: ${prompts}`);
            if (jumpsA.length > 5) {
                jumpsA = jumpsA.slice(0, 5);
            }
            _ = editSession(jumpsA, jumps, results, prompt_idx, start_target);
            // we know we are at the end here 
            if (prompt_idx > 4) { 
                console.log("finished game, setting prompt_idx to 4");
                prompt_idx = 4 
                start_target = prompts[prompt_idx]
                renderToFrom(start_target, jumps)
                // console.log("here is the start_target", start_target);
                renderPrompts(prompts, prompt_idx, jumpsA, jumps, start_target=start_target)
                renderLinks(start_target, results, true)
            } else {
                start_target = prompts[prompt_idx]
                renderToFrom(start_target, jumps)
                console.log(`[From index] prompts: ${prompts}, i: ${prompt_idx}, local_jumpsA: ${jumpsA}, jumps: ${jumps}`);
                renderPrompts(prompts, prompt_idx, jumpsA, jumps, start_target=start_target)
                renderLinks(start_target, results)
                activateLinks()
            }
         })

</script>
