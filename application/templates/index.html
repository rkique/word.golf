    // check local storage 
    
    // this is the value from local storage which is the i value (states which prompt I am currently on)
    let i = parseInt(localStorage.getItem('current_prompt')) || 0;

    // this is a function that accesses local storage and then converts the value to a list.
    function string_to_list(list) {
        return list ? list.split(',').map(item => item.trim()) : [];
    }

    // We're loading local storage values if they exist (they wouldn't on first load).

    let local_jumpsA = string_to_list(localStorage.getItem('jumpsA') || null)
    let local_results = string_to_list(localStorage.getItem('results') || null)
    let jumps = parseInt(localStorage.getItem('jumps')) || 0;
    
    
    let prompt = data['prompt'].toString()

    let prompts = data['prompts']
    start_target = data['prompts'][i];

    console.log("start_target", start_target);
    console.log(i);
    // send to backend to edit the variables updated from local storage 
    _ = callEditSesh(local_jumpsA, jumps, local_results, i, start_target);

    // let board_state;
    let board_state = local_results.length ? local_results : data["results"];
    
    
    renderToFrom(start_target)
    renderPrompts(prompts, i, local_jumpsA, jumps)
    renderLinks(start_target, board_state)
    activateLinks()

    // local storage set date
    localStorage.setItem('current_date', data['date']);


</script>
