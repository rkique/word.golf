<script>
    function loadLocalStorage() {
        let prompt_idx = parseInt(localStorage.getItem('current_prompt')) || 0;
        let jumpsA = string_to_list(localStorage.getItem('jumpsA') || null);
        let jumps = parseInt(localStorage.getItem('jumps')) || 0;
        let results = string_to_list(localStorage.getItem('results') || null);
        let prompts = localStorage.getItem('prompts');
        let start_target = prompts.split(',').slice(prompt_idx, prompt_idx + 2);
        console.log(`Loading from local storage: prompt_idx: ${prompt_idx}, jumpsA: ${jumpsA}, jumps: ${jumps}, results: ${results}, start_target: ${start_target}, prompts: ${prompts}`);
        return { jumpsA, jumps, results, prompt_idx, start_target, prompts };
    }

    //if the user has never completed the help sequence before, 
    //use a help_session.
    if (!localStorage.getItem('current_date') || localStorage.getItem('is_help') == 'true') {
        localStorage.setItem('is_help', 'true');
        data = sendAndReceiveXML(`help=true`);
    }


    if (localStorage.getItem('lastComplete') && data['date'] == localStorage.getItem('lastComplete')) {
        showScreen();
    }
    else {
        function string_to_list(list) {
            return list ? list.split(',').map(item => item.trim()) : [];
        }

        function string_to_prompt_list(str) {
            if (!str) return [];
            const arr = str.split(',').map(s => s.trim());
            let result = [];
            for (let i = 0; i < arr.length; i += 2) {
                result.push(arr.slice(i, i + 2));
            }
            return result;
        }
        let jumpsA = [], jumps = 0, results = [], prompt_idx = 0, start_target = [], prompts = [];

        if (localStorage.getItem('results')) {
            console.log('Loading from local storage');
            let loaded = loadLocalStorage();
            jumpsA = loaded.jumpsA;
            jumps = loaded.jumps;
            results = loaded.results;
            prompt_idx = loaded.prompt_idx;
            prompts = string_to_prompt_list(loaded.prompts);
            start_target = prompts[prompt_idx]
        } else {
            console.log('Loading from data');
            jumpsA = data['jumpsA'] || [];
            jumps = data['jumps'] || 0;
            results = data['results'] || [];
            prompt_idx = data['prompt_idx'] || 0;
            prompts = data['prompts'] || '';
            start_target = prompts[prompt_idx];
        }


        console.log(`[final] jumpsA: ${jumpsA}, jumps: ${jumps}, results: ${results}, prompt_idx: ${prompt_idx}, start_target: ${start_target}, prompts: ${prompts}`);
        _ = editSession(jumpsA, jumps, results, prompt_idx, start_target);

        if (prompt_idx == 5) {
            renderToFrom(prompts[4])
        } else {
            renderToFrom(start_target)
        }
        console.log(`[From index] prompts: ${prompts}, i: ${prompt_idx}, local_jumpsA: ${jumpsA}, jumps: ${jumps}`);
        renderPrompts(prompts, prompt_idx, jumpsA, jumps)
        renderLinks(start_target, results)
        activateLinks()
        localStorage.setItem('current_date', data['date']);
    }


</script>
