<script>

    data = JSON.parse('{{data|tojson|safe}}');
    window.addEventListener('load', function () {
        // Check if the browser is Safari and not running on localhost
        if (isSafari() && window.location.origin !== 'http://127.0.0.1:8080') {
            if (window.location.search.indexOf('v=') === -1) {
                var uniqueParam = 'v=' + new Date().getTime();
                var newUrl = 'https://www.word.golf?' + uniqueParam;
                window.location.replace(newUrl);
            }
        }
    });

    function isSafari() {
        // return false;
        var userAgent = navigator.userAgent;
        return /Safari/.test(userAgent) && !/Chrome/.test(userAgent);
    }


</script>

<script>
    localStorage.setItem('current_date', data['date']);
    let is_help = localStorage.getItem('is_help');
    if ("logged_in" in data) { 
        if (data.logged_in) {
            renderLogin(data.logged_in)
        }
    }
    // start help session
    if (is_help !== 'false') {
        if (!data.logged_in) {
            startHelpSession()
            localStorage.setItem('in_progress', 'true');
        }
    }
    else {
        console.log("[index]: here is backend data: ", data);
        let prompt_idx = data['i'];
        let jumpsArray = data.jumpsArray;
        let jumps = data.jumps;
        let results = data.results;
        let prompts = data.prompts;
        let start_target = prompts[prompt_idx];
        console.log("[index]: here is start target: ", start_target);
        start_target[0] = results[10];
        let startTargetIdxs = data.startTargetIdxs
        // check if prompt_idx is 5 
        const is_end = 'total_jumps' in data ? data.total_jumps : 0;
        // _ = editSession(jumpsArray, jumps, results, prompt_idx, start_target);
        renderPrompts(jumpsArray, data.wordsArray, startTargetIdxs, start_target, data.score, is_end);
        // start_target = prompts[prompt_idx];
        renderLinks(start_target, results, prompt_idx, is_end);
        activateLinks();
    }
</script>
