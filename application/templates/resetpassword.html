
<!DOCTYPE html>
<html lang="en">
<head>
{% include 'head.html' %}
<title>Reset Password</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/login_pw.css') }}">

  <style>
    input::placeholder {
    
    font-size: 0.85em;
    color: var(--text-color);
    opacity: 1; /* Optional: ensure it's fully visible */
    }
  #step1, #step2{
    display: flex;
    flex-direction: column;
  }
    input[type="email"] {
      width: 100%;
      height: 48px;              /* Make input longer horizontally and control vertical size */
      font-size: 1.5rem;
      margin-top: 8px;
      margin-bottom: 10px;       /* Reduce space below input */
      box-sizing: border-box;
      border: 1.5px solid #bcbcbc;
      border-radius: 6px;
      background: #fafafa;
      transition: border 0.2s;
    }
      input[type="email"]:focus {
      outline: none;
    }

    .subtitle {
      width: 100%;
      margin-top: 0;
      margin-bottom: 24px; /* More space below subtitle */
      color: var(--border-color);
      font-size: 1.08rem;
      font-weight: 400;
    }

    h2 {
      text-align: center;
      width: 100%;
      margin-bottom: 16px; /* More space below heading */
    }

    a {
      color: var(--text-color)
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: block;
      justify-content: center; /* Center horizontally */
      align-items: flex-start; /* Align to top */
      background: var(--background-color);
      color: var(--text-color);
    }
    
    .wg-banner {
      text-align: center;
      width: 100vw;
      margin: 0 auto;
      min-width: 320px;
      border-bottom: 1px solid var(--border-color);
    }
    .wg-banner-title {
      font-family: 'Schibsted Grotesk', sans-serif;
      font-size: 2.5rem;
      font-weight: 500;
      letter-spacing: 1px;
      text-align: center;
      user-select: none;
      text-decoration: none;
    }
    .center-container {
      width: 100%;
      max-width: 520px; /* Larger container for part 2 */
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      margin: 25px auto 0 auto;
      padding: 0 18px;
    }

    label {
      display: block;
      margin-top: 0;
      width: 100%;
      text-align: left;
      font-weight: 300;
    }

    #sendPinBtn:disabled {
      background: #bcbcbc;
      color: #fff;
      cursor: not-allowed;
    }

    .message {
      font-weight: 200;
      font-size: 1.5rem;
      margin-top: 15px;
      text-align: center;
    }
    .error {
      font-style: italic;
       color: var(--greyed-out-color);
    }
    .success { 
      color: green;
     }

    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(0, 0, 0, 0.3);
      border-radius: 50%;
      border-top-color: #000;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .hidden { display: none; }

    #newPassword {
      width: 100%;           /* Make the input wider */
      height: 54px;          /* Make it about 15% taller than default (default ~40px) */
      padding-right: 44px;   /* Space for the eye icon */
      font-size: 1.25rem;
      box-sizing: border-box;
    }
    .input-box {
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      /* To allow the input to overflow a bit if needed */
      overflow-x: visible;
    }
    
    #togglePassword {
      position: absolute;
      right: 14px;
      top: 45%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      object-fit: contain;
    }
    #step2 label {
      font-size: 1.25rem;      /* Larger label text for part 2 */
      font-weight: 300;
      margin-bottom: 12px;
      margin-top: 24px;
    }
    #step2 label[for="newPassword"] {
      margin-top: 12px;    /* Less space above the label */
      margin-bottom: 6px;  /* Less space below the label */
    }
    #step2 .input-box,
    #step2 input[type="text"],
    #step2 input[type="password"] {
      width: 100%;
    }
    #step2 input[type="text"],
    #step2 input[type="password"] {
      padding: 0;
      font-size: 1.25rem;
      margin-bottom: 5px;     /* More space between boxes */
      border-radius: 6px;
      border: 1.5px solid #bcbcbc;
      background: #fafafa;
      transition: border 0.2s;
    }
    #step2 input[type="text"]:focus,
    #step2 input[type="password"]:focus {
      border: 2px solid #121212;
      background: #fff;
      outline: none;
    }
    #step2 .input-box {
      margin-bottom: 12px; /* Less space below the password box */
    }
    #step2 button {
      margin-top: 18px;
      padding: 16px 0;
      font-size: 1.15rem;
    }
       /* Add this to your <style> section above */
    .action-btn {
      background: #000;
      color: #fff;
      margin-top: 5px;
      width: 100%;
      padding: 12px 0;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    /* Make reset password button look the same */
    /* #resetPasswordBtn {
      background: #000;
      color: #fff;
      margin-top: 8px;     
      margin-bottom: 8px; 
      width: 100%;
      padding: 12px 0;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    } */

    #backToGameBtn.action-btn {
      margin-top: 0;       /* Remove extra space above */
    }
  </style>
</head>

<body>
  {% include 'banner-heading.html' %}
  <div class="center-container">
    <h2>Reset Your Password</h2>
    <div id="step1">
      <div class="subtitle">Enter the email you used to register</div>
      <input type="email" id="email" placeholder="you@example.com" required />
      <button id="sendPinBtn" class="switch switch--outlined" >Send PIN</button>
      <div id="step1Msg" class="message"></div>
    </div>
    <div id="step2" style="display:none;">
      <label for="pin">Enter the 6-digit PIN sent to your email:</label>
      <input type="text" id="pin" maxlength="6" placeholder="123456" required />
      <label for="newPassword">Enter your new password:</label>
      <div class="input-box">
        <input type="password" id="newPassword" placeholder="New password" required />
        <img src="../static/images/pass_open_eye.png" alt="Toggle Password Visibility" id="togglePassword">
      </div>
      
      <button id="resetPasswordBtn">Reset Password</button>
      <div id="step2Msg" class="message"></div> 
      <!-- <button id="backToGameBtn" class="action-btn" onclick="window.location.href='/'">Back to Game</button> -->
    </div>
  </div>

<script>
  const current_date = "{{ date }}";
</script>

<script>
    document.getElementById('togglePassword').addEventListener('click', () => {
      let passwordInput = document.getElementById('newPassword');
      if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          
          document.getElementById('togglePassword').src = '../static/images/pass_close_eye.png'; // Change to closed eye icon
      } else {
          passwordInput.type = 'password';
          document.getElementById('togglePassword').src = '../static/images/pass_open_eye.png'; // Change to open eye icon
      }
    });

    document.getElementById('sendPinBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const msgEl = document.getElementById('step1Msg');
      const sendPinBtn = document.getElementById('sendPinBtn');
      const spinner = document.createElement('div');
      spinner.className = 'spinner';
      msgEl.textContent = '';
      // Make sure to add a loading screen here and disable the button until the request is complete (this is important
      // because if the user clicks the button multiple times, it will send multiple requests, leading to multiple PINs being sent.
      // this is bad because we have a limit on the number of PINs that can be sent per day total, so we don't want to waste them.
      // the number of PINs that can be sent per day is between 100 and 500, so if the user clicks the button multiple times, 
      // it will waste those PINs.)

      // just for testing purposes, no request to backend just straight to step 2
      // document.getElementById('step1').style.display = 'none';
      // document.getElementById('step2').style.display = 'flex';

      if (!email) {
        msgEl.textContent = 'Please enter your email.';
        msgEl.className = 'message error';
        return;
      }
      const mail_val = document.getElementById('email');
      if (!mail_val.checkValidity()) {
        msgEl.textContent = 'Please enter a valid email address.';
        msgEl.className = 'message error';
        return;
      }
      // Replace button with spinner and disable it
      sendPinBtn.disabled = true;
      sendPinBtn.textContent = '';
      sendPinBtn.appendChild(spinner);
      let should_show_reset_button = false;
      try {
          const res = await fetch(`/forgot_password`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email })
          });
          const data = await res.json();
          if (res.ok) {
              msgEl.textContent = data.message;
              msgEl.className = 'message success';
              // Show step 2
              document.getElementById('step1').style.display = 'none';
              document.getElementById('step2').style.display = 'block';
          } else {
              msgEl.textContent = data.error || 'Failed to send PIN.';
              msgEl.className = 'message error';
              should_show_reset_button = true;
          }
      } catch (err) {
          msgEl.textContent = 'Network error.';
          msgEl.className = 'message error';
          should_show_reset_button = true;
      } 
      // Re-enable button and remove spinner on an error
      if (should_show_reset_button) {
          sendPinBtn.disabled = false;
          sendPinBtn.textContent = 'Send PIN';
          if (spinner.parentNode) {
              spinner.parentNode.removeChild(spinner);
          }
      }

    });

    document.getElementById('resetPasswordBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const pin = document.getElementById('pin').value.trim();
      const newPassword = document.getElementById('newPassword').value;
      const msgEl = document.getElementById('step2Msg');
      msgEl.textContent = '';

      if (!pin || pin.length !== 6) {
          msgEl.textContent = 'Please enter a valid 6-digit PIN.';
          msgEl.className = 'message error';
          return;
      }
      if (!newPassword) {
          msgEl.textContent = 'Please enter a new password.';
          msgEl.className = 'message error';
          return;
      }

      try {
          const res = await fetch(`/reset_password`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, pin, new_password: newPassword })
          });
          const data = await res.json();
          if (res.ok) {
              msgEl.textContent = data.message;
              msgEl.className = 'message success';
              // Redirect user to login page from here -> Should reveal the login page button here 
          } else {
              msgEl.textContent = data.error || 'Failed to reset password.';
              msgEl.className = 'message error';
          }
      } catch (err) {
          msgEl.textContent = 'Network error.';
          msgEl.className = 'message error';
      }
    });
</script>

</body>
</html>
