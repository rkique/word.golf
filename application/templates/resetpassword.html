<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; }
    label { display: block; margin-top: 15px; }
    input { width: 100%; padding: 8px; margin-top: 5px; }
    button { margin-top: 20px; padding: 10px; width: 100%; }
    .message { margin-top: 15px; font-weight: bold; }
    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>

  <h2>Reset Password</h2>

  <div id="step1">
    <label for="email">Enter your email to get reset PIN:</label>
    <input type="email" id="email" placeholder="you@example.com" required />
    <button id="sendPinBtn">Send PIN</button>
    <div id="step1Msg" class="message"></div>
  </div>

  <div id="step2" style="display:none;">
    <label for="pin">Enter the 6-digit PIN sent to your email:</label>
    <input type="text" id="pin" maxlength="6" placeholder="123456" required />

    <label for="newPassword">Enter your new password:</label>
    <input type="password" id="newPassword" placeholder="New password" required />

    <button id="resetPasswordBtn">Reset Password</button>
    <div id="step2Msg" class="message"></div>
    <button onclick="window.location.href='/'" class="switch switch--outlined">Back to Game</button>
  </div>

<script>
    const backendURL = 'http://localhost:7000'; // development
    // const backendURL = 'https://word-golf-backend.onrender.com'; // production

    document.getElementById('sendPinBtn').addEventListener('click', async () => {
        const email = document.getElementById('email').value.trim();
        const msgEl = document.getElementById('step1Msg');
        msgEl.textContent = '';
        // Make sure to add a loading screen here and disable the button until the request is complete (this is important
        // because if the user clicks the button multiple times, it will send multiple requests, leading to multiple PINs being sent.
        // this is bad because we have a limit on the number of PINs that can be sent per day total, so we don't want to waste them.
        // the number of PINs that can be sent per day is between 100 and 500, so if the user clicks the button multiple times, 
        // it will waste those PINs.)
        if (!email) {
            msgEl.textContent = 'Please enter your email.';
            msgEl.className = 'message error';
            return;
        }
        try {
            const res = await fetch(`${backendURL}/forgot_password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            if (res.ok) {
                msgEl.textContent = data.message;
                msgEl.className = 'message success';
                // Show step 2
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
            } else {
                msgEl.textContent = data.error || 'Failed to send PIN.';
                msgEl.className = 'message error';
            }
        } catch (err) {
            msgEl.textContent = 'Network error.';
            msgEl.className = 'message error';
        }
    });

    document.getElementById('resetPasswordBtn').addEventListener('click', async () => {
        const email = document.getElementById('email').value.trim();
        const pin = document.getElementById('pin').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        const msgEl = document.getElementById('step2Msg');
        msgEl.textContent = '';

        if (!pin || pin.length !== 6) {
            msgEl.textContent = 'Please enter a valid 6-digit PIN.';
            msgEl.className = 'message error';
            return;
        }
        if (!newPassword) {
            msgEl.textContent = 'Please enter a new password.';
            msgEl.className = 'message error';
            return;
        }

        try {
            const res = await fetch(`${backendURL}/reset_password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, pin, new_password: newPassword })
            });
            const data = await res.json();
            if (res.ok) {
                msgEl.textContent = data.message;
                msgEl.className = 'message success';
                // Redirect user to login page from here -> Should reveal the login page button here 
            } else {
                msgEl.textContent = data.error || 'Failed to reset password.';
                msgEl.className = 'message error';
            }
        } catch (err) {
            msgEl.textContent = 'Network error.';
            msgEl.className = 'message error';
        }
    });
</script>

</body>
</html>
</script>
