<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

<!-- D3.js CDN for force-directed network diagrams -->
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="{{ url_for('static', filename='js/finish_graph.js', v=version) }}"></script>

<script>
    let graphInitialized = false;
    let userModalSwiper = null;
    
    // Only initialize Swiper on mobile devices
    if (window.innerWidth <= 992) {
        // Mobile: Initialize Swiper
        userModalSwiper = new Swiper('#user-modal-swiper', {
            direction: 'horizontal',
            loop: false,
            slidesPerView: 1,
            spaceBetween: 0,
            
            pagination: {
                el: '.swiper-pagination',
                clickable: true,
            },
            
            touchRatio: 1,
            touchAngle: 45,
            grabCursor: true,
            
            // Event handlers
            on: {
                slideChange: function () {
                    const activeSlideIndex = this.activeIndex;
                    
                    // If we're on slide 1 (graph slide) and graph hasn't been initialized
                    if (activeSlideIndex === 1 && !graphInitialized) {
                        // Show the graph container
                        const container = document.getElementById('word-path-container-user');
                        if (container) {
                            container.style.display = 'block';
                            graphInitialized = true;
                        }
                    }
                }
            }
        });
    } else {
        // Desktop: Convert to flex layout and show graph immediately
        const swiperContainer = document.getElementById('user-modal-swiper');
        if (swiperContainer) {
            swiperContainer.style.display = 'flex';
            swiperContainer.style.gap = '2rem';
            swiperContainer.style.flexDirection = 'column';
            
            const swiperWrapper = swiperContainer.querySelector('.swiper-wrapper');
            if (swiperWrapper) {
            swiperWrapper.style.display = 'flex';
            swiperWrapper.style.flexDirection = 'row';
            swiperWrapper.style.width = '100%';
            }
            const slides = swiperContainer.querySelectorAll('.swiper-slide');
            slides.forEach((slide, index) => {
            if (index === 1) {
                slide.style.flex = '0 0 60%';
            } else {
                slide.style.flex = '0 0 40%';
            }
            slide.style.minWidth = '0';
            });
            
            // Hide pagination on desktop
            const pagination = swiperContainer.querySelector('.swiper-pagination');
            if (pagination) {pagination.style.display = 'none';}
        }
        graphInitialized = true;
    }
</script>
