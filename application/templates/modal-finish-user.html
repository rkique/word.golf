<div id="modal-finish-user" class="modal-finish">
    <div id='finish-container' class='finish-container'>
        <div class="finish-close" onclick="closeModal('modal-finish-user')">✕</div>
        <div class="daily-idx-tag">
            <span class="hash">#</span>
            <span class="daily-idx"></span>
        </div>
        <!-- <div class="inline-title">
            <h1 id="finish-summary" class="finish-summary">Summary</h1>
        </div> -->
        <div class="stat-column-user">
            <div>
                <p class="stat totalJumps"></p>
                <p class="stat-subtitle"> jumps</p>
            </div>
            <div>
                <p class="stat streak"></p>
                <p class="stat-subtitle">streak</p>
            </div>
            <div>
                <p class="stat totalGames"></p>
                <p class="stat-subtitle">days played</p>
            </div>
            <!-- <div>
            <p class="selectedWords"></p>
            <p>your paths</p>
            </div> -->
        </div>
        <div class="stat-row">
            <div class="solutionWords" id=""></div>
            <p class="stat-subtitle">solutions</p>
        </div>
        
        <!-- Network Diagram Container -->
        <div id="word-path-container-user" style="
            background-color: var(--grayed-out-background, #2a2a2a);
            border-radius: 8px;
            border: 1px solid var(--border-color, #444);
            display: none;
        ">
            <h3 style="
                margin: 0 0 15px 0;
                color: var(--text-color, #ffffff);
                font-size: 16px;
                text-align: center;
            ">Word Path Network</h3>
                        <div id="network-diagram-user" style="
                width: 100%;
                height: 600px;
                border: 1px solid var(--grayed-out-background, #ccc);
                border-radius: 8px;
                position: relative;
                overflow: auto;
            ">
                <svg id="path-svg-user" width="400" height="400" style="background: var(--background-color, #1a1a1a);">
                </svg>
            </div>
            <button id="animate-paths" style="
                margin-top: 10px;
                padding: 8px 16px;
                background-color: var(--hover-color, #3a3a3a);
                color: var(--text-color, #ffffff);
                border: 1px solid var(--border-color, #555);
                border-radius: 4px;
                cursor: pointer;
                width: 100%;
                font-size: 14px;
            " onclick="window.drawNetworkDiagram()">
                Animate Paths
            </button>
        </div>
    </div>
    <div class="stat-row">
        <a id="shareLink">
            Share
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-copy">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
        </a>
        <div class="svg-download-container">
            <a id="downloadSvg" onclick="downloadSvg('path-svg-user')" style="cursor: pointer; margin-left: 10px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-download">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
            </a>
            <span class="spoilers-tooltip">
                <span class="caution-icon">⚠</span>spoilers
            </span>
        </div>
    </div>
    <!-- <button class="switch switch--outlined" onclick="window.location.href='/user-statistics'">View Stats</button> -->
</div>
</div>
<script>
    if (window.innerWidth <= 992) {
        const comeBackTomorrowElement = document.getElementById('come-back-tomorrow');
        if (comeBackTomorrowElement) {
            comeBackTomorrowElement.remove(); // Remove the element
        }

        const finishSummaryElement = document.getElementById('finish-summary');
        if (finishSummaryElement) {
            finishSummaryElement.remove(); // Remove the element
        }
    }
</script>

<!-- D3.js CDN for force-directed network diagrams -->
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="{{ url_for('static', filename='js/finish_graph.js', v=version) }}"></script>
