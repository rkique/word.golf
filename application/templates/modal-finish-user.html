<div id="modal-finish-user" class="modal-finish">
    <div id='finish-container' class='finish-container'>
        <div class="finish-close" onclick="closeModal('modal-finish-user')">✕</div>
        <div class="daily-idx-tag">
            <span class="hash">#</span>
            <span class="daily-idx"></span>
        </div>
        <div class="inline-title">
            <h1 class="finish-summary">Summary</h1>
        </div>
        <div class="stat-row">
            <div class="stat-column">
                <div>
                    <p class="stat totalJumps"></p>
                    <p> jumps</p>
                </div>
                <div>
                    <p class="stat streak"></p>
                    <p>streak</p>
                </div>
            </div>
            <!-- <div>
            <p class="selectedWords"></p>
            <p>your paths</p>
            </div> -->
        </div>
        <div class="stat-row">
            <div class="solutionWords" id=""></div>
            <p class="solution-title">solutions</p>
        </div>
    </div>
    <div class="stat-row">
        <a id="shareLink">
            Share your results
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-copy">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
        </a>
    </div>

    <button class="switch switch--outlined" onclick="window.location.href='/previous-prompts'">View Prev Prompts</button>
    <button id="replay-button" class="switch switch--outlined" onclick="window.location.href='/replay-game'" style="display: none;" >Replay Past Game</button>
</div>
</div>
