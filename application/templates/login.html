<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login / Create User</title>
</head>
<body>

<h2>Login</h2>
<form id="loginForm">
  <label>
    Username:
    <input type="text" id="loginUsername" required />
  </label><br/>
  <label>
    Password:
    <input type="password" id="loginPassword" required />
  </label><br/>
  <button type="submit">Login</button>
</form>

<hr/>

<h2>Create User</h2>
<form id="createUserForm">
  <label>
    Username:
    <input type="text" id="createUsername" required />
  </label><br/>
  <label>
    Password:
    <input type="password" id="createPassword" required />
  </label><br/>
  <button type="submit">Create User</button>
</form>

<div id="responseMessage" style="color: red; margin-top: 20px;"></div>

<button id="getDataBtn">Get User Data</button>
<pre id="userDataOutput"></pre>

<script>
const backendURL = "http://localhost:7000" // testing 
// const backendURL = "https://word-golf-backend.onrender.com"; // production 

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = document.getElementById("loginUsername").value;
  const password = document.getElementById("loginPassword").value;

  // Use GET /login?username=...&password=...
  const url = new URL(backendURL + "/login");
  url.searchParams.append("username", username);
  url.searchParams.append("password", password);

  try {
    const res = await fetch(url, {
      method: "GET",
      credentials: "include", 
    });
    const data = await res.json();
    if (res.ok) {
      document.getElementById("responseMessage").style.color = "green";
      document.getElementById("responseMessage").textContent = data.message || "Login successful!";
      // TODO: Redirect or do something on successful login
      // do a redirection to the normal word golf page -> show success message
    } else {
      document.getElementById("responseMessage").style.color = "red";
      document.getElementById("responseMessage").textContent = data.error || "Login failed";
    }
  } catch (err) {
    document.getElementById("responseMessage").style.color = "red";
    document.getElementById("responseMessage").textContent = "Network error";
  }
});

document.getElementById("createUserForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = document.getElementById("createUsername").value;
  const password = document.getElementById("createPassword").value;

  try {
    const res = await fetch(backendURL + "/create_user", {
      method: "POST",
      credentials: "include", // to store cookies sent by backend
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (res.ok) {
      document.getElementById("responseMessage").style.color = "green";
      document.getElementById("responseMessage").textContent = data.message || "User created successfully!";
      // do something here 
      // do a redirection to the normal word golf page -> show success message
    } else {
      document.getElementById("responseMessage").style.color = "red";
      document.getElementById("responseMessage").textContent = data.error || "User creation failed";
    }
  } catch (err) {
    document.getElementById("responseMessage").style.color = "red";
    document.getElementById("responseMessage").textContent = "Network error";
  }
});

document.getElementById("getDataBtn").addEventListener("click", async () => {
  try {
    const res = await fetch(backendURL + "/data", {
      method: "GET",
      credentials: "include", // important to include session cookie
    });

    const data = await res.json();
    const output = document.getElementById("userDataOutput");

    if (res.ok) {
      output.style.color = "black";
      output.textContent = JSON.stringify(data, null, 2);
    } else {
      output.style.color = "red";
      output.textContent = data.error || "Failed to fetch data";
    }
  } catch (err) {
    const output = document.getElementById("userDataOutput");
    output.style.color = "red";
    output.textContent = "Network error";
  }
});

</script>

</body>
</html>
