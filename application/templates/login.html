<!DOCTYPE html>
<html lang="en">

<style>
  #loginForm, #createUserForm {
    font-size: 2.2rem;
    min-width: 35vw;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  h1, h2{
    font-size: 2.2rem;
    font-weight: 600;
    margin-top: 0.5rem;
    margin-bottom: 0.8rem;
    line-height: 1.2;

  }
  .form-row{
    margin: 0.5rem;
    font-size: 1.45rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 0.5rem;
  }

  /* need to override tachyons default */
  .form-row, button {
    margin: 0.5rem !important; 
  }

  .form-rows {
    display: flex;
    flex-direction: column;
    gap: 1rem;

  }

  /* need to override tachyons default */
  input {
    font-size: 2.2rem !important;
    width: 20rem;
    color: var(--text-color);
    background: transparent;
    border: 1px solid var(--border-color);
    border-radius: 0.6rem;
  }
  #login-global{
    justify-content: center;
    gap: 5vw;
    min-height: 100vh;
    align-items: center;
  }

  .loginContainer, .createUserContainer {
    padding: 2rem;
    border-radius: 1.2rem;
    border: 1px solid var(--border-color);
    min-width: 40vw;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  #login-global > * > *{
    /* border: 1px solid var(--border-color); */
  }
  button {
    background-color: var(--background-color);
    color: var(--text-color);
    font-size: 0.8rem !important;
    padding: 1em 3em !important;
    border: none;
    border-radius: 1.2rem;
    cursor: pointer;
    transition: background 0.2s;
    outline: 1px solid var(--border-color);
    margin-top: 1.5em;
}

</style>
<head>
{% include 'head.html' %}
<title>Login / Create User</title>
</head>
<div id="login-global" class="flex">
  <body>
    <div class="loginContainer">
      <h2>Login</h2>
      <form id="loginForm">
        <div class="form-rows">
          <div class="form-row">
            <label> Email</label>
            <input type="text" id="loginEmail" required />
          </div>
          <div class="form-row">
            <label>Password </label>
             <input type="password" id="loginPassword" required />
          </div>
          <div>
            <button type="submit" class="switch switch--outlined">Continue</button>
            <!-- <button class="switch switch--outlined" id="logoutBtn">Logout</button> -->
              <script src="https://accounts.google.com/gsi/client" async></script>
              <div id="g_id_onload"
                  data-client_id="YOUR_GOOGLE_CLIENT_ID"
                  data-login_uri="https://your.domain/your_login_endpoint"
                  data-auto_prompt="false">
              </div>
              <div class="g_id_signin"
                  data-type="standard"
                  data-size="large"
                  data-theme="outline"
                  data-text="sign_in_with"
                  data-shape="rectangular"
                  data-logo_alignment="left">
              </div>
            <!-- <button onclick="window.location.href='/resetpassword'" class="switch switch--outlined">Reset Password</button> -->
          </div>
        </div>
    </div>

    </form>
    <!-- <div class="createUserContainer">
      <h2>Create User</h2>
      <form id="createUserForm">
        <div class="form-rows">
          <div class="form-row">
            <label>Email </label>
            <input type="text" id="createEmail" required />
          </div>
          <div class="form-row">
            <label>Password</label>
            <input type="password" id="createPassword" required />
          </div>
          <div>
            <button type="submit" class="switch switch--outlined">Create User</button>
          </div>
        </div>
      </form>
    </div> -->

    <pre id="userDataOutput"></pre>
    <div id="responseMessage" style="color: red; margin-top: 20px;"></div>
    <button id="getUserHistoryBtn" class="switch switch--outlined">Get User History</button>
    <pre id="userHistoryOutput"></pre>
    <pre id="LogoutOutput"></pre>
     -->

</div>

<script>
const backendURL = "http://localhost:7000" // testing 
// const backendURL = "https://word-golf-backend.onrender.com"; // production 

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;

  // Use GET /login?email=...&password=...
try {
    const res = await fetch(backendURL + "/login", {
        method: "POST",
        credentials: "include", // to store cookies sent by backend (make sure all requests to backend have this)
        headers: {
            "Content-Type": "application/json",
        },
        body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (res.ok) {
      document.getElementById("responseMessage").style.color = "green";
      document.getElementById("responseMessage").textContent = data.message || "Login successful!";
      // TODO: Redirect or do something on successful login
      // do a redirection to the normal word golf page -> show success message
    } else {
      document.getElementById("responseMessage").style.color = "red";
      document.getElementById("responseMessage").textContent = data.error || "Login failed";
    }
  } catch (err) {
    document.getElementById("responseMessage").style.color = "red";
    document.getElementById("responseMessage").textContent = "Network error";
  }
});

document.getElementById("createUserForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("createEmail").value;
  const password = document.getElementById("createPassword").value;

  try {
    const res = await fetch(backendURL + "/create_user", {
      method: "POST",
      credentials: "include", // to store cookies sent by backend (make sure all requests to backend have this)
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (res.ok) {
      document.getElementById("responseMessage").style.color = "green";
      document.getElementById("responseMessage").textContent = data.message || "User created successfully!";
      // do something here 
      // do a redirection to the normal word golf page -> show success message
    } else {
      document.getElementById("responseMessage").style.color = "red";
      document.getElementById("responseMessage").textContent = data.error || "User creation failed";
    }
  } catch (err) {
    document.getElementById("responseMessage").style.color = "red";
    document.getElementById("responseMessage").textContent = "Network error";
  }
});

document.getElementById("getDataBtn").addEventListener("click", async () => {
  try {
    const res = await fetch(backendURL + "/data", {
      method: "GET",
      credentials: "include", // to store cookies sent by backend (make sure all requests to backend have this)
    });

    const data = await res.json();
    const output = document.getElementById("userDataOutput");

    if (res.ok) {
      output.style.color = "black";
      output.textContent = JSON.stringify(data, null, 2);
    } else {
      output.style.color = "red";
      output.textContent = data.error || "Failed to fetch data";
    }
  } catch (err) {
    const output = document.getElementById("userDataOutput");
    output.style.color = "red";
    output.textContent = "Network error";
  }
});

document.getElementById("getUserHistoryBtn").addEventListener("click", async () => {
  try {
    const res = await fetch(backendURL + "/game_history", {
      method: "GET",
      credentials: "include", // to store cookies sent by backend (make sure all requests to backend have this)
    });

    const data = await res.json();
    const output = document.getElementById("userHistoryOutput");

    if (res.ok) {
      output.style.color = "black";
      output.textContent = JSON.stringify(data, null, 2);
    } else {
      output.style.color = "red";
      output.textContent = data.error || "Failed to fetch user history";
    }
  } catch (err) {
    const output = document.getElementById("userHistoryOutput");
    output.style.color = "red";
    output.textContent = "Network error";
  }
});

document.getElementById("googleLoginBtn").addEventListener("click", async () => {

  // This is the google login button. When I tested it, I realized that when I logged in with Google, 
  // it cleared the session storage in the routes backend (so when printing the value out it is null/empty list), so that is why whenever 
  // I log in with Google, I redirect to the home page. 
  window.location.href = backendURL + "/login/google";
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  try {
    const res = await fetch(backendURL + "/logout", {
      method: "POST",
      credentials: "include", // to store cookies sent by backend (make sure all requests to backend have this)
    });

    const data = await res.json();
    const output = document.getElementById("LogoutOutput");

    if (res.ok) {
      output.style.color = "green";
      output.textContent = data.message || "Logout successful!";
      
      window.location.href = '/'; // Change this but this just redirects to the main page
    } else {
      output.style.color = "red";
      output.textContent = data.error || "Logout failed";
    }
  } catch (err) {
    const output = document.getElementById("LogoutOutput");
    output.style.color = "red";
    output.textContent = "Network error";
  }
});


</script>

</body>
</html>
