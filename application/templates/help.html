<script>
    function beginTutorial() {
        localStorage.setItem('is_help', 'true');
        
        toggleElement('help');
        resp = sendAndReceiveXML(`help=true`)
        renderToFrom(resp.prompt);
        document.querySelector('.prompt-box').style.border = '1px solid var(--border-color)';
        renderLinks(resp.prompt, resp.results)
        console.log('[reportSessionEnded] Rendering prompts..')
        renderPrompts(resp.prompts, resp.i, resp.jumpsA, resp.jumps)
        activateLinks()
    }
    toggleElement('help')
</script>
<div id="help" class="help" style="display: none;">
    <div class="help-container">
            <h1>How to play</h1>
        <div class='help-text'>
            <p>Link a start word to a target word by clicking on neighbors.</p>
            <p class='--grayed-out'>cement ⟶ lumber ⟶ forests ⟶ woodlands</p>
            <p>Choose carefully! Each target can be reached in two jumps.</p>
            <p class='--grayed-out'>fountain ⟶ piers ⟶ coastline</p>
            <p>Five prompts are released each day.</p>
        </div>
        <div class="help-buttons">
        <button onclick="toggleElement('help')" class="switch switch--outlined">play</button>
        <button onclick="window.location.href='/login'" class="switch switch--outlined">login</button>
         <script src="https://accounts.google.com/gsi/client" async></script>
        <div id="g_id_onload"
            data-client_id="YOUR_GOOGLE_CLIENT_ID"
            data-login_uri="https://your.domain/your_login_endpoint"
            data-auto_prompt="false">
        </div>
        <div class="g_id_signin"
            data-type="standard"
            data-size="large"
            data-theme="outline"
            data-text="sign_in_with"
            data-shape="rectangular"
            data-logo_alignment="left">
        </div>
        <button onclick="beginTutorial()" class=" switch switch--outlined ">tutorial</button>
        </div>
    </div>
</div>
