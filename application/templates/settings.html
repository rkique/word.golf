<script>
    //NB: flex is assumed to be default display mode
    function toggleElement(id) {
        const el = document.getElementById(id); 
        el.style.display = (el.style.display === 'flex') ? 'none' : 'flex';
    }

    async function renderBack() {

        try {
            const res = await fetch("/back", {
                method: "POST",
                credentials: "include", // to store cookies sent by backend (make sure all requests to backend have this)
                headers: {
                    'Content-Type': 'application/json' 
                },
            });
            const data = await res.json();
            if (res.ok) {
                // Can only go back once -> you can't continuously go backwards 
                console.log("Clicked back button");
                console.log("Here is data: ", data);
                let is_help = localStorage.getItem('is_help');
                
                // otherwise do nothing 
                if ("results" in data && is_help === 'false') {
                    renderPrompts(data.jumpsArray, data.startTargetIdxs, data.start_target);
                    renderLinks(data.prompt, data.results)
                    activateLinks()
                } else {
                    console.log("Bad back button -> failed or is not allowed")
                }
                
            } else {
                console.log("Back failed:", data);
            }
        } catch (err) {
            console.log("Error during back: ", err);
        }
    }

    async function renderSkip() {
        try {
            const res = await fetch("/skip", {
                method: "POST",
                credentials: "include",
                headers: {
                    'Content-Type': 'application/json'
                },
            });
            const data = await res.json();
            if (res.ok) {
                console.log("Clicked skip button");
                console.log("Here is data: ", data);
                let is_help = localStorage.getItem('is_help');
                // otherwise do nothing 
                if ("results" in data && is_help === 'false') {
                    renderPrompts(data.jumpsArray, data.startTargetIdxs, data.start_target, data.done);
                    renderLinks(data.prompt, data.results, data.current_prompt, data.done);
                    activateLinks();
                } else {
                    console.log("Bad skip button -> failed or is not allowed")
                }
                
            } else {
                console.log("Skip failed:", data);
            }
        } catch (err) {
            console.log("Error during skip: ", err);
        }
    }


</script>
