    <script>
    async function renderLogout(){
        try {
            const res = await fetch("/logout", {
                method: "POST",
                credentials: "include", // to store cookies sent by backend (make sure all requests to backend have this)
                headers: {
                    'Content-Type': 'application/json'  // Ensure this matches what the server expects
                },
                body: JSON.stringify({
                    date: new Date().toISOString().split('T')[0]
                })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.removeItem('logged_in');
                window.location.href = '/';
            } else {
                console.log("Logout failed:", data);
            }
        } catch (err) {
            console.log("Error during logout:", err);
        }
        // }
    }
</script>

<body>

<script>
// Draggable divider functionality
document.addEventListener('DOMContentLoaded', function() {
    const divider = document.getElementById('divider');
    const leftPanel = document.getElementById('statistics');
    const rightPanel = document.getElementById('calendar-container');
    const container = document.querySelector('.global');
    
    let isDragging = false;
    
    divider.addEventListener('mousedown', function(e) {
        isDragging = true;
        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);
        e.preventDefault();
    });
    
    function handleMouseMove(e) {
        if (!isDragging) return;
        
        const containerRect = container.getBoundingClientRect();
        const mouseX = e.clientX - containerRect.left;
        const containerWidth = containerRect.width;
        
        // Calculate percentages
        const leftWidth = (mouseX / containerWidth) * 100;
        const rightWidth = 100 - leftWidth - (4 / containerWidth * 100); // Subtract divider width percentage
        
        console.log('Mouse position:', mouseX, 'Container width:', containerWidth);
        console.log('Left width:', leftWidth, 'Right width:', rightWidth);
        
        // Set minimum and maximum widths (20% to 75%)
        if (leftWidth >= 20 && leftWidth <= 75) {
            leftPanel.style.width = `${leftWidth}%`;
            rightPanel.style.width = `${rightWidth}%`;
        }
    }
    
    function handleMouseUp() {
        isDragging = false;
        document.removeEventListener('mousemove', handleMouseMove);
        document.removeEventListener('mouseup', handleMouseUp);
    }
});
</script>

<script>
    const labels = JSON.parse('{{ jumps_data|tojson|safe }}').map(entry => entry.date);

    console.log("HERE IS MY JUMPS");
    const myJumpsToday = JSON.parse('{{ my_jumps_today|tojson|safe }}');
    console.log(myJumpsToday);
    console.log("HERE IS TOTAL STATISTICS TODAY");
    const todayJumpStats = JSON.parse('{{ today_jumps_stats|tojson|safe }}');
    console.log(todayJumpStats);

    function renderGraph() {
        const ctx = document.getElementById('jumps-graph').getContext('2d');
        const data = JSON.parse('{{ jumps_data|tojson|safe }}');
        const averageData = JSON.parse('{{ jumps_average_data|tojson|safe }}');

        console.log("here is average data");
        console.log(averageData);
        console.log("here is jumps data");
        console.log(data);

        const totalJumps = data.map(entry => entry.total_jumps);
        const averageJumps = averageData.map(entry => entry.average_jumps);

        const allYValues = totalJumps.concat(averageJumps);
        const computedMaxY = Math.max(...allYValues);
        const yMax = Math.max(computedMaxY, 25) + 1;
        const yMin = 9;
        const failure = getCSSVariable('--failure');
        const softFailure = getCSSVariable('--soft-failure');
        const grayedOutBackground = getCSSVariable('--grayed-out-background');
        const textColor = getCSSVariable('--text-color');
        const backgroundColor = getCSSVariable('--grayed-out-background');
        const labelsMonthDay = labels.map(date => {
            const d = new Date(date);
            return `${d.getMonth() + 1}/${d.getDate()}`;
        });
        
        // Check if there are any perfect games (10 jumps)
        const hasPerfectGame = totalJumps.includes(10);
        // Check if there are any superb games (11-12 jumps)
        const hasSuperbGame = totalJumps.some(jumps => jumps >= 11 && jumps <= 12);
        
        // Build datasets array
        const datasets = [{
            label: 'Jumps',
            data: totalJumps,
            borderColor: grayedOutBackground,
            pointBackgroundColor: function(context) {
                const value = context.parsed.y;
                if (value === 10) return '#ffff00'; // Yellow for perfect
                if (value >= 11 && value <= 12) return '#00ff00'; // Green for superb
                return textColor; // Default color
            },
            backgroundColor: backgroundColor,
            fill: false,
            showLine: true,
            pointRadius: 5,
        },
        {
            label: 'Average',
            data: averageJumps,
            borderColor: softFailure,
            pointBackgroundColor: failure, 
            backgroundColor: 'rgba(255, 0, 0, 0)',
            fill: false,
            borderWidth: 2,
            tension: 0.1,
            showLine: true,
            pointRadius: 5,
        }];
        
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labelsMonthDay,
                datasets: datasets
            },
            options: {
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                hover: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    legend: {
                        labels: {
                            color: textColor, // <-- legend text color
                            usePointStyle: true, // This makes legend items use point styles instead of rectangles
                            generateLabels: function(chart) {
                                const original = Chart.defaults.plugins.legend.labels.generateLabels;
                                const labels = original.call(this, chart);
                                
                                // Add perfect game legend item if there are perfect games
                                if (hasPerfectGame) {
                                    labels.push({
                                        text: 'Perfect (10)',
                                        fillStyle: '#ffff00',
                                        strokeStyle: '#ffff00',
                                        pointStyle: 'circle',
                                        hidden: false,
                                        datasetIndex: -1, // Not associated with a dataset
                                        lineWidth: 2
                                    });
                                }
                                
                                // Add superb game legend item if there are superb games
                                if (hasSuperbGame) {
                                    labels.push({
                                        text: 'Superb (11-12)',
                                        fillStyle: '#00ff00',
                                        strokeStyle: '#00ff00',
                                        pointStyle: 'circle',
                                        hidden: false,
                                        datasetIndex: -1, // Not associated with a dataset
                                        lineWidth: 2
                                    });
                                }
                                
                                return labels;
                            }
                        }
                    },
                    title: {
                        display: false,
                        color: textColor
                    },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                        animation: false,
                        backgroundColor: backgroundColor,
                        titleColor: textColor,
                        bodyColor: textColor,
                        borderColor: textColor,
                        borderWidth: 1,
                        callbacks: {
                            title: function(context) {
                                const index = context[0].dataIndex;
                                const date = new Date(labels[index]);
                                return date.toLocaleDateString('en-US', { 
                                    weekday: 'short', 
                                    month: 'short', 
                                    day: 'numeric' 
                                });
                            },
                            label: function(context) {
                                const label = context.dataset.label;
                                const value = context.parsed.y;
                                
                                if (label === 'Jumps') {
                                    let performance = '';
                                    if (value === 10) performance = ' (Perfect!)';
                                    else if (value >= 11 && value <= 12) performance = ' (Superb!)';
                                    return `${label}: ${value}${performance}`;
                                }
                                return `${label}: ${value.toFixed(1)}`;
                            }
                        }
                    },
                },
                scales: {
                    x: {
                        grid: {
                            color: grayedOutBackground,
                            drawOnChartArea: false // <-- removes vertical grid lines
                        },
                        ticks: {
                            color: textColor, // <-- x-axis labels
                            callback: function(value, index, values) {
                                return labelsMonthDay[index]; // Format as month/day
                            }
                        },
                        title: {
                            display: true,
                            text: 'Date played',
                            color: textColor
                        }
                    },
                    y: {
                        min: yMin,
                        max: yMax,
                        grid: {
                            color: grayedOutBackground,
                        },
                        ticks: {
                            color: textColor // <-- y-axis labels
                        },
                        title: {
                            display: true,
                            text: 'Total Jumps',
                            color: textColor
                        }
                    }
                }
            }
        });
    }


    renderGraph();
</script>

<script type="module">
    document.addEventListener('DOMContentLoaded', function () {
        const calendarData = JSON.parse('{{ month_stats|tojson|safe }}');
        const incompleteData = JSON.parse('{{ incomplete_games|tojson|safe }}');

        console.log("here is calendar data");
        console.log(calendarData);
        console.log("here is incomplete data");
        console.log(incompleteData);

        const eventDates = new Set(
            calendarData.map(event => {
                return new Date(event.date).toISOString().split('T')[0];
            })
        );

        const incompleteDates = new Set(
            incompleteData.map(event => {
                return new Date(event.date).toISOString().split('T')[0];
            })
        );
        const borderColor = getCSSVariable('--grayed-out-background');
        const softCheck = getCSSVariable('--soft-check');
        const calendarEl = document.getElementById('calendar');
        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            initialDate: '2025-07-01',
            selectable: true,
            selectHelper: true,
            showNonCurrentDates: false,
            validRange: {
                start: '2025-06-01',
                end: '2025-08-01'
            },
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: ''
            },
            dateClick: function(info) {
                const clickedDate = info.dateStr;

                fetch('/total_jumps_statistics_per_day', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ date: clickedDate })
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Network response was not ok");
                    }
                    return response.json();
                })
                .then(data => {
                    console.log("Jump stats for", clickedDate, "→", data);
                    console.log("My jump stats: ", data.my_jumps);
                    console.log("Everyone else's jump stats: ", data.other_jumps);
                    // You can now use data.my_jumps and data.other_jumps here
                })
                .catch(error => {
                    console.error("Error fetching jump statistics:", error);
                });
                // first day is 2025-06-01 (but profile starts from 2025-07-01)
                // const dateClicked = new Date(clickedDate);
                // const firstDate = new Date("2025-06-01");
                // const diffInMs = dateClicked - firstDate;
                // const diffInDays = Math.floor(diffInMs / (1000 * 60 * 60 * 24));
                // console.log("Difference in days:", diffInDays);

                // window.location.href = '/previous_index?day=' + diffInDays;
            },
            dayCellDidMount: function(info) {
                const date = info.date;
                const dateString = date.toISOString().split('T')[0]; 
                console.log(dateString);
                info.el.style.border = `1px solid ${borderColor}`;
                
                if (!info.el.classList.contains('fc-day-disabled')) {
                    if (eventDates.has(dateString)) {
                        // Add green checkmark for completed games
                        const img = document.createElement('img');
                        img.src = '../static/images/green_check.png';
                        img.alt = 'Completed';
                        img.style.width = '30px';
                        img.style.height = '30px';
                        img.style.display = 'block';
                        img.style.margin = '0 auto';
                        img.style.marginTop = '4px';
                        img.style.backgroundColor = 'transparent';
                        
                        const eventContainer = info.el.querySelector('.fc-daygrid-day-events');
                        if (eventContainer) {
                            eventContainer.appendChild(img);
                        }
                    } else if (incompleteDates.has(dateString)) {
                        // Add yellow exclamation for incomplete games
                        const img = document.createElement('img');
                        img.src = '../static/images/yellow_exclamation.png';
                        img.alt = 'Incomplete';
                        img.style.width = '25px';
                        img.style.height = '25px';
                        img.style.display = 'block';
                        img.style.margin = '0 auto';
                        img.style.marginTop = '4px';
                        img.style.backgroundColor = 'transparent';
                        
                        const eventContainer = info.el.querySelector('.fc-daygrid-day-events');
                        if (eventContainer) {
                            eventContainer.appendChild(img);
                        }
                    }
                }
            },
            datesSet: function() {
                // Remove existing images
                document.querySelectorAll('.fc-daygrid-day img').forEach(img => img.remove());

                document.querySelectorAll('.fc-daygrid-day:not(.fc-day-disabled)').forEach(cell => {
                    const dateString = cell.getAttribute('data-date'); 
                    if (!dateString) return;

                    const eventContainer = cell.querySelector('.fc-daygrid-day-events');
                    if (!eventContainer) return;

                    if (eventDates.has(dateString)) {
                        const img = document.createElement('img');
                        img.src = '../static/images/green_check.png';
                        img.alt = 'Completed';
                        img.style.width = '30px';
                        img.style.height = '30px';
                        img.style.display = 'block';
                        img.style.margin = '0 auto';
                        img.style.marginTop = '4px';
                        img.style.backgroundColor = 'transparent';
                        eventContainer.appendChild(img);
                    } else if (incompleteDates.has(dateString)) {
                        const img = document.createElement('img');
                        img.src = '../static/images/yellow_exclamation.png';
                        img.alt = 'Incomplete';
                        img.style.width = '25px';
                        img.style.height = '25px';
                        img.style.display = 'block';
                        img.style.margin = '0 auto';
                        img.style.marginTop = '4px';
                        img.style.backgroundColor = 'transparent';
                        eventContainer.appendChild(img);
                    }
                });
            }
        });

        calendar.render();

        // Hide the today button like in previous-prompts
        const todayButton = document.querySelector('.fc-today-button.fc-button.fc-button-primary');
        if (todayButton) {
            todayButton.style.display = 'none';
        }
    });
</script>
